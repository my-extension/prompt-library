<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Prompt Library</title>

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link rel="stylesheet" href="./style.css">
</head>

<body>
  <main class="container">

    <h1>Prompt Library is ready to use</h1>

    <p class="subtitle">
      Chrome hides new extensions under the puzzle icon.
    </p>

    <section class="step">
      <div class="step-title">
        1. Click the puzzle icon and pin Prompt Library
      </div>

      <img
        class="step-image"
        src="./assets/step-1.png"
        alt="How to pin Prompt Library extension"
      >
    </section>

    <section class="step">
      <div class="step-title">
        2. Open Prompt Library from the browser toolbar
      </div>

      <img
        class="step-image"
        src="./assets/step-2.png"
        alt="How to open Prompt Library"
      >
    </section>

    <p class="footer-note">
      Your prompts are stored locally in your browser.
    </p>

  </main>
</body>
</html>
